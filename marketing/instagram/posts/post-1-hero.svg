<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#0f1f0f"/>
    </linearGradient>
    <linearGradient id="limeglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8F03A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#C8F03A;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="360" x2="1080" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="720" x2="1080" y2="720" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="1080" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="1080" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Lime glow blob top-right -->
  <ellipse cx="900" cy="180" rx="320" ry="250" fill="rgba(200,240,58,0.07)"/>
  <!-- Orange glow blob bottom-left -->
  <ellipse cx="180" cy="900" rx="280" ry="220" fill="rgba(255,107,53,0.06)"/>

  <!-- Top badge -->
  <rect x="390" y="80" width="300" height="44" rx="22" fill="rgba(200,240,58,0.12)" stroke="rgba(200,240,58,0.3)" stroke-width="1"/>
  <circle cx="415" cy="102" r="5" fill="#C8F03A"/>
  <text x="430" y="108" font-family="Arial, sans-serif" font-size="16" fill="#C8F03A" font-weight="600" letter-spacing="2">BATHSPA ACADEMIC CENTRE RAK</text>

  <!-- Logo -->
  <text x="540" y="230" font-family="Arial Black, sans-serif" font-size="108" fill="#C8F03A" font-weight="900" text-anchor="middle" filter="url(#glow)" letter-spacing="-4">Car<tspan fill="#F0F0E8">Fun</tspan></text>

  <!-- Divider line -->
  <line x1="200" y1="270" x2="880" y2="270" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Main headline -->
  <text x="540" y="360" font-family="Arial Black, sans-serif" font-size="72" fill="#F0F0E8" font-weight="900" text-anchor="middle" letter-spacing="-2">Share rides,</text>
  <text x="540" y="450" font-family="Arial Black, sans-serif" font-size="72" fill="#C8F03A" font-weight="900" text-anchor="middle" letter-spacing="-2">share costs.</text>

  <!-- Sub text -->
  <text x="540" y="530" font-family="Arial, sans-serif" font-size="26" fill="#888888" text-anchor="middle" font-weight="300">The free carpooling app for BathSpa RAK students.</text>
  <text x="540" y="566" font-family="Arial, sans-serif" font-size="26" fill="#888888" text-anchor="middle" font-weight="300">Match with classmates. Split the fuel. Save every month.</text>

  <!-- Stats row -->
  <rect x="100" y="620" width="260" height="140" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="230" y="682" font-family="Arial Black, sans-serif" font-size="48" fill="#C8F03A" font-weight="900" text-anchor="middle">340+</text>
  <text x="230" y="718" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">Active members</text>

  <rect x="410" y="620" width="260" height="140" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="540" y="682" font-family="Arial Black, sans-serif" font-size="48" fill="#C8F03A" font-weight="900" text-anchor="middle">AED 65</text>
  <text x="540" y="718" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">Avg. monthly saving</text>

  <rect x="720" y="620" width="260" height="140" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="850" y="682" font-family="Arial Black, sans-serif" font-size="48" fill="#C8F03A" font-weight="900" text-anchor="middle">4.8★</text>
  <text x="850" y="718" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">Average rating</text>

  <!-- CTA Button -->
  <rect x="350" y="810" width="380" height="72" rx="36" fill="#C8F03A"/>
  <text x="540" y="855" font-family="Arial Black, sans-serif" font-size="26" fill="#1A1A1A" font-weight="900" text-anchor="middle">Join Free → carfun.app</text>

  <!-- Bottom tag -->
  <text x="540" y="970" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.2)" text-anchor="middle">#CarFun  #BathSpaRAK  #RAKCommute  #CarpoolingRAK</text>

  <!-- Decorative car icon -->
  <text x="990" y="1040" font-family="Arial, sans-serif" font-size="36" fill="rgba(200,240,58,0.15)" text-anchor="end">🚗</text>
</svg>
