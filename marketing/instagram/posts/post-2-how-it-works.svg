<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#111f11"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <ellipse cx="540" cy="200" rx="400" ry="200" fill="rgba(200,240,58,0.05)"/>

  <!-- Header -->
  <text x="540" y="80" font-family="Arial, sans-serif" font-size="15" fill="#C8F03A" font-weight="600" text-anchor="middle" letter-spacing="3">HOW IT WORKS</text>
  <text x="540" y="150" font-family="Arial Black, sans-serif" font-size="64" fill="#F0F0E8" font-weight="900" text-anchor="middle" letter-spacing="-2">Up and running</text>
  <text x="540" y="220" font-family="Arial Black, sans-serif" font-size="64" fill="#C8F03A" font-weight="900" text-anchor="middle" letter-spacing="-2">in minutes.</text>

  <!-- Step 1 -->
  <rect x="80" y="290" width="440" height="340" rx="20" fill="rgba(42,42,42,0.95)" stroke="rgba(200,240,58,0.2)" stroke-width="1"/>
  <text x="130" y="360" font-family="Arial Black, sans-serif" font-size="72" fill="rgba(200,240,58,0.1)" font-weight="900">01</text>
  <text x="130" y="420" font-family="Arial, sans-serif" font-size="48">🎓</text>
  <text x="130" y="490" font-family="Arial Black, sans-serif" font-size="30" fill="#F0F0E8" font-weight="700">Create a free</text>
  <text x="130" y="528" font-family="Arial Black, sans-serif" font-size="30" fill="#F0F0E8" font-weight="700">account</text>
  <text x="130" y="575" font-family="Arial, sans-serif" font-size="20" fill="#888">Sign up with your email</text>
  <text x="130" y="600" font-family="Arial, sans-serif" font-size="20" fill="#888">in seconds. It's free.</text>

  <!-- Step 2 -->
  <rect x="560" y="290" width="440" height="340" rx="20" fill="rgba(42,42,42,0.95)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="610" y="360" font-family="Arial Black, sans-serif" font-size="72" fill="rgba(200,240,58,0.1)" font-weight="900">02</text>
  <text x="610" y="420" font-family="Arial, sans-serif" font-size="48">📍</text>
  <text x="610" y="490" font-family="Arial Black, sans-serif" font-size="30" fill="#F0F0E8" font-weight="700">Enter your</text>
  <text x="610" y="528" font-family="Arial Black, sans-serif" font-size="30" fill="#F0F0E8" font-weight="700">RAK area</text>
  <text x="610" y="575" font-family="Arial, sans-serif" font-size="20" fill="#888">We match you with nearby</text>
  <text x="610" y="600" font-family="Arial, sans-serif" font-size="20" fill="#888">BathSpa commuters.</text>

  <!-- Step 3 -->
  <rect x="80" y="660" width="440" height="340" rx="20" fill="rgba(42,42,42,0.95)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="130" y="730" font-family="Arial Black, sans-serif" font-size="72" fill="rgba(200,240,58,0.1)" font-weight="900">03</text>
  <text x="130" y="790" font-family="Arial, sans-serif" font-size="48">📅</text>
  <text x="130" y="860" font-family="Arial Black, sans-serif" font-size="30" fill="#F0F0E8" font-weight="700">Add your</text>
  <text x="130" y="898" font-family="Arial Black, sans-serif" font-size="30" fill="#F0F0E8" font-weight="700">schedule</text>
  <text x="130" y="945" font-family="Arial, sans-serif" font-size="20" fill="#888">Set your commute days</text>
  <text x="130" y="970" font-family="Arial, sans-serif" font-size="20" fill="#888">and travel times.</text>

  <!-- Step 4 -->
  <rect x="560" y="660" width="440" height="340" rx="20" fill="rgba(42,42,42,0.95)" stroke="rgba(200,240,58,0.3)" stroke-width="1.5"/>
  <text x="610" y="730" font-family="Arial Black, sans-serif" font-size="72" fill="rgba(200,240,58,0.1)" font-weight="900">04</text>
  <text x="610" y="790" font-family="Arial, sans-serif" font-size="48">🚗</text>
  <text x="610" y="860" font-family="Arial Black, sans-serif" font-size="30" fill="#C8F03A" font-weight="700">Match and</text>
  <text x="610" y="898" font-family="Arial Black, sans-serif" font-size="30" fill="#C8F03A" font-weight="700">go!</text>
  <text x="610" y="945" font-family="Arial, sans-serif" font-size="20" fill="#888">Get matched with drivers</text>
  <text x="610" y="970" font-family="Arial, sans-serif" font-size="20" fill="#888">heading to campus.</text>

  <!-- Logo watermark -->
  <text x="540" y="1058" font-family="Arial Black, sans-serif" font-size="22" fill="rgba(200,240,58,0.3)" text-anchor="middle" font-weight="900">CarFun</text>
</svg>
