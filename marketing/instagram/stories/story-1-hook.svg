<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a0f"/>
      <stop offset="50%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#1a1000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <ellipse cx="900" cy="400" rx="500" ry="400" fill="rgba(200,240,58,0.06)"/>
  <ellipse cx="200" cy="1500" rx="400" ry="300" fill="rgba(255,107,53,0.05)"/>

  <!-- Top logo area -->
  <text x="80" y="130" font-family="Arial Black, sans-serif" font-size="44" fill="#C8F03A" font-weight="900" letter-spacing="-1">Car<tspan fill="#F0F0E8">Fun</tspan></text>
  <rect x="80" y="155" width="230" height="38" rx="19" fill="rgba(200,240,58,0.1)" stroke="rgba(200,240,58,0.25)" stroke-width="1"/>
  <circle cx="105" cy="174" r="5" fill="#C8F03A"/>
  <text x="120" y="180" font-family="Arial, sans-serif" font-size="14" fill="#C8F03A" font-weight="500" letter-spacing="1.5">BATHSPA RAK CARPOOLING</text>

  <!-- Hook question -->
  <text x="80" y="380" font-family="Arial Black, sans-serif" font-size="90" fill="#F0F0E8" font-weight="900" letter-spacing="-3">Still</text>
  <text x="80" y="480" font-family="Arial Black, sans-serif" font-size="90" fill="#F0F0E8" font-weight="900" letter-spacing="-3">commuting</text>
  <text x="80" y="580" font-family="Arial Black, sans-serif" font-size="90" fill="#F0F0E8" font-weight="900" letter-spacing="-3">alone</text>
  <text x="80" y="680" font-family="Arial Black, sans-serif" font-size="90" fill="#FF6B35" font-weight="900" letter-spacing="-3">every day?</text>

  <!-- Sad cost breakdown -->
  <rect x="80" y="730" width="920" height="110" rx="16" fill="rgba(255,80,80,0.07)" stroke="rgba(255,80,80,0.18)" stroke-width="1"/>
  <text x="140" y="796" font-family="Arial, sans-serif" font-size="44">💸</text>
  <text x="220" y="785" font-family="Arial Black, sans-serif" font-size="32" fill="#ff8080" font-weight="700">Paying AED 260+ every month?</text>
  <text x="220" y="822" font-family="Arial, sans-serif" font-size="22" fill="#888">Solo transport to BathSpa RAK adds up fast.</text>

  <!-- Arrow -->
  <text x="540" y="910" font-family="Arial, sans-serif" font-size="72" text-anchor="middle" fill="rgba(200,240,58,0.5)">↓</text>

  <!-- Solution -->
  <text x="80" y="1020" font-family="Arial Black, sans-serif" font-size="72" fill="#F0F0E8" font-weight="900" letter-spacing="-2">There's a</text>
  <text x="80" y="1110" font-family="Arial Black, sans-serif" font-size="72" fill="#C8F03A" font-weight="900" letter-spacing="-2">smarter way.</text>

  <!-- CarFun pitch -->
  <rect x="80" y="1160" width="920" height="340" rx="20" fill="rgba(42,42,42,0.95)" stroke="rgba(200,240,58,0.2)" stroke-width="1"/>
  <text x="540" y="1240" font-family="Arial Black, sans-serif" font-size="52" fill="#C8F03A" font-weight="900" text-anchor="middle" letter-spacing="-1">CarFun</text>
  <text x="540" y="1300" font-family="Arial, sans-serif" font-size="28" fill="#F0F0E8" text-anchor="middle">Match with classmates in your</text>
  <text x="540" y="1336" font-family="Arial, sans-serif" font-size="28" fill="#F0F0E8" text-anchor="middle">RAK area. Share the ride.</text>
  <text x="540" y="1372" font-family="Arial, sans-serif" font-size="28" fill="#F0F0E8" text-anchor="middle">Split the cost.</text>
  <line x1="240" y1="1400" x2="840" y2="1400" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="540" y="1460" font-family="Arial Black, sans-serif" font-size="36" fill="#C8F03A" font-weight="900" text-anchor="middle">Save up to AED 65/month 🎉</text>

  <!-- CTA -->
  <rect x="140" y="1570" width="800" height="86" rx="43" fill="#C8F03A"/>
  <text x="540" y="1623" font-family="Arial Black, sans-serif" font-size="32" fill="#1A1A1A" font-weight="900" text-anchor="middle">Join free → Link in bio</text>

  <!-- Bottom area -->
  <text x="540" y="1760" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.15)" text-anchor="middle">#CarFun  #BathSpaRAK  #RAKStudents</text>
  <text x="540" y="1800" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.1)" text-anchor="middle">#CarpoolingRAK  #SaveMoney  #UniversityLife</text>

  <!-- Swipe up hint -->
  <text x="540" y="1870" font-family="Arial, sans-serif" font-size="24" fill="rgba(200,240,58,0.4)" text-anchor="middle">↑  Swipe up to join</text>
</svg>
