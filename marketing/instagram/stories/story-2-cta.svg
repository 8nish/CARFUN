<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#0a1a0a"/>
    </linearGradient>
    <linearGradient id="limebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8F03A"/>
      <stop offset="100%" style="stop-color:#a0d020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <ellipse cx="540" cy="960" rx="600" ry="500" fill="rgba(200,240,58,0.04)"/>

  <!-- Top lime bar -->
  <rect x="0" y="0" width="1080" height="10" fill="url(#limebar)"/>

  <!-- Logo -->
  <text x="540" y="160" font-family="Arial Black, sans-serif" font-size="100" fill="#C8F03A" font-weight="900" text-anchor="middle" filter="url(#glow)" letter-spacing="-3">Car<tspan fill="#F0F0E8">Fun</tspan></text>
  <text x="540" y="210" font-family="Arial, sans-serif" font-size="22" fill="#888" text-anchor="middle" letter-spacing="2">FREE CARPOOLING FOR BATHSPA RAK</text>

  <!-- Big CTA headline -->
  <text x="540" y="370" font-family="Arial Black, sans-serif" font-size="82" fill="#F0F0E8" font-weight="900" text-anchor="middle" letter-spacing="-2">Ready to</text>
  <text x="540" y="462" font-family="Arial Black, sans-serif" font-size="82" fill="#C8F03A" font-weight="900" text-anchor="middle" letter-spacing="-2">save money</text>
  <text x="540" y="554" font-family="Arial Black, sans-serif" font-size="82" fill="#F0F0E8" font-weight="900" text-anchor="middle" letter-spacing="-2">on every ride?</text>

  <!-- Steps to join -->
  <text x="540" y="640" font-family="Arial, sans-serif" font-size="22" fill="#C8F03A" text-anchor="middle" font-weight="600" letter-spacing="2">HOW TO GET STARTED</text>

  <!-- Step 1 -->
  <rect x="80" y="670" width="920" height="130" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(200,240,58,0.15)" stroke-width="1"/>
  <circle cx="148" cy="735" r="36" fill="rgba(200,240,58,0.15)" stroke="rgba(200,240,58,0.4)" stroke-width="2"/>
  <text x="148" y="745" font-family="Arial Black, sans-serif" font-size="28" fill="#C8F03A" text-anchor="middle" font-weight="900">1</text>
  <text x="210" y="722" font-family="Arial Black, sans-serif" font-size="28" fill="#F0F0E8" font-weight="700">Click the link in bio</text>
  <text x="210" y="758" font-family="Arial, sans-serif" font-size="22" fill="#888">Go to CarFun and hit "Join Free"</text>

  <!-- Step 2 -->
  <rect x="80" y="820" width="920" height="130" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="148" cy="885" r="36" fill="rgba(200,240,58,0.15)" stroke="rgba(200,240,58,0.4)" stroke-width="2"/>
  <text x="148" y="895" font-family="Arial Black, sans-serif" font-size="28" fill="#C8F03A" text-anchor="middle" font-weight="900">2</text>
  <text x="210" y="872" font-family="Arial Black, sans-serif" font-size="28" fill="#F0F0E8" font-weight="700">Set your profile</text>
  <text x="210" y="908" font-family="Arial, sans-serif" font-size="22" fill="#888">Add your area, schedule, driver/passenger</text>

  <!-- Step 3 -->
  <rect x="80" y="970" width="920" height="130" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="148" cy="1035" r="36" fill="rgba(200,240,58,0.15)" stroke="rgba(200,240,58,0.4)" stroke-width="2"/>
  <text x="148" y="1045" font-family="Arial Black, sans-serif" font-size="28" fill="#C8F03A" text-anchor="middle" font-weight="900">3</text>
  <text x="210" y="1022" font-family="Arial Black, sans-serif" font-size="28" fill="#F0F0E8" font-weight="700">Find or offer a ride</text>
  <text x="210" y="1058" font-family="Arial, sans-serif" font-size="22" fill="#888">Browse rides near you or post your own</text>

  <!-- Step 4 -->
  <rect x="80" y="1120" width="920" height="130" rx="16" fill="rgba(42,42,42,0.9)" stroke="rgba(200,240,58,0.3)" stroke-width="1.5"/>
  <circle cx="148" cy="1185" r="36" fill="rgba(200,240,58,0.2)" stroke="#C8F03A" stroke-width="2"/>
  <text x="148" y="1195" font-family="Arial Black, sans-serif" font-size="28" fill="#C8F03A" text-anchor="middle" font-weight="900">4</text>
  <text x="210" y="1172" font-family="Arial Black, sans-serif" font-size="28" fill="#C8F03A" font-weight="700">Start saving! 🚗</text>
  <text x="210" y="1208" font-family="Arial, sans-serif" font-size="22" fill="#888">Save up to AED 65 every single month</text>

  <!-- Divider -->
  <line x1="140" y1="1300" x2="940" y2="1300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Areas covered -->
  <text x="540" y="1360" font-family="Arial, sans-serif" font-size="20" fill="#C8F03A" text-anchor="middle" font-weight="600" letter-spacing="2">AREAS COVERED</text>
  <text x="540" y="1404" font-family="Arial, sans-serif" font-size="22" fill="#888" text-anchor="middle">Al Nakheel · Al Hamra · Khuzam · Al Mairid</text>
  <text x="540" y="1436" font-family="Arial, sans-serif" font-size="22" fill="#888" text-anchor="middle">Al Rams · Digdaga · Julfar · Al Marjan Island</text>
  <text x="540" y="1468" font-family="Arial, sans-serif" font-size="22" fill="#888" text-anchor="middle">Wadi Shah · Al Qusaidat · and more</text>

  <!-- CTA button -->
  <rect x="140" y="1540" width="800" height="86" rx="43" fill="#C8F03A"/>
  <text x="540" y="1595" font-family="Arial Black, sans-serif" font-size="34" fill="#1A1A1A" font-weight="900" text-anchor="middle">Join Free — Link in Bio 🔗</text>

  <!-- Stats row -->
  <rect x="80" y="1670" width="280" height="120" rx="14" fill="rgba(42,42,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="220" y="1728" font-family="Arial Black, sans-serif" font-size="40" fill="#C8F03A" font-weight="900" text-anchor="middle">340+</text>
  <text x="220" y="1764" font-family="Arial, sans-serif" font-size="18" fill="#888" text-anchor="middle">Members</text>

  <rect x="400" y="1670" width="280" height="120" rx="14" fill="rgba(42,42,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="540" y="1728" font-family="Arial Black, sans-serif" font-size="40" fill="#C8F03A" font-weight="900" text-anchor="middle">AED 65</text>
  <text x="540" y="1764" font-family="Arial, sans-serif" font-size="18" fill="#888" text-anchor="middle">Avg. Saving</text>

  <rect x="720" y="1670" width="280" height="120" rx="14" fill="rgba(42,42,42,0.8)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="860" y="1728" font-family="Arial Black, sans-serif" font-size="40" fill="#C8F03A" font-weight="900" text-anchor="middle">4.8★</text>
  <text x="860" y="1764" font-family="Arial, sans-serif" font-size="18" fill="#888" text-anchor="middle">Avg. Rating</text>

  <!-- Swipe -->
  <text x="540" y="1870" font-family="Arial, sans-serif" font-size="26" fill="rgba(200,240,58,0.4)" text-anchor="middle">↑  Swipe up to join CarFun</text>
</svg>
